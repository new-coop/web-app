<div class="container form-page form-page--narrow">
  <mifosx-form-workspace eyebrow="labels.heading.Accounting" title="labels.heading.Accruals">
    <form [formGroup]="periodicAccrualsForm" (ngSubmit)="submit()" class="form-workspace-form">
      <div class="form-workspace-body">
        <section class="form-section">
          <h2 class="form-section-title">{{ 'labels.heading.General' | translate }}</h2>
          <div class="form-grid">
            <mat-form-field class="form-field-full" (click)="tillDatePicker.open()">
              <mat-label>{{ 'labels.inputs.Accrue Till Date' | translate }}</mat-label>
              <input
                matInput
                [min]="minDate"
                [max]="maxDate"
                [matDatepicker]="tillDatePicker"
                required
                formControlName="tillDate"
              />
              <mat-datepicker-toggle matSuffix [for]="tillDatePicker"></mat-datepicker-toggle>
              <mat-datepicker #tillDatePicker></mat-datepicker>
              @if (periodicAccrualsForm.controls.tillDate.hasError('required')) {
                <mat-error>
                  {{ 'labels.inputs.Accrue Date' | translate }} {{ 'labels.commons.is' | translate }}
                  <strong>{{ 'labels.commons.required' | translate }}</strong>
                </mat-error>
              }
            </mat-form-field>
          </div>
        </section>
      </div>

      <footer class="form-workspace-footer">
        <button type="button" mat-raised-button [routerLink]="['../']">
          {{ 'labels.buttons.Cancel' | translate }}
        </button>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          *mifosxHasPermission="'EXECUTE_PERIODICACCRUALACCOUNTING'"
        >
          <fa-icon icon="play" class="m-r-10"></fa-icon>
          {{ 'labels.buttons.Run Periodic Accruals' | translate }}
        </button>
      </footer>
    </form>
  </mifosx-form-workspace>
</div>
