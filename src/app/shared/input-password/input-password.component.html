<mat-form-field class="flex-100" mifosxFieldIcon="false">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    [disabled]="disabled"
    [errorStateMatcher]="matcher"
    (focusout)="onFocusOut()"
    (input)="onInput($event)"
    [required]="required"
    [type]="type"
    [value]="value"
  />
  @if (type === 'password') {
    <mifosx-m3-icon matIconPrefix name="lock" variant="duotone" [size]="22"></mifosx-m3-icon>
  }
  <button
    type="button"
    matSuffix
    mat-icon-button
    (click)="onVisibilityClick($event)"
    [attr.aria-label]="type === 'password' ? 'Show password' : 'Hide password'"
  >
    <mifosx-m3-icon [name]="icon" [size]="22"></mifosx-m3-icon>
  </button>
  @if (ngControl.hasError('required')) {
    <mat-error>{{ 'errors.validation.requiredField' | translate: { label: label } }}</mat-error>
  }
  @if (ngControl.hasError(customErrorName)) {
    <mat-error>{{ customErrorMessage }}</mat-error>
  }
</mat-form-field>
