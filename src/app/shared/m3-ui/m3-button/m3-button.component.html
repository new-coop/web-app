<div [class]="containerClasses">
  @switch (variant) {
    @case ('filled') {
      <md-filled-button
        [type]="type"
        [disabled]="isDisabled"
        [attr.aria-busy]="loading || null"
        [attr.aria-label]="ariaLabel || null"
        (click)="onClick($event)"
      >
        <ng-container *ngTemplateOutlet="buttonInner" />
      </md-filled-button>
    }
    @case ('outlined') {
      <md-outlined-button
        [type]="type"
        [disabled]="isDisabled"
        [attr.aria-busy]="loading || null"
        [attr.aria-label]="ariaLabel || null"
        (click)="onClick($event)"
      >
        <ng-container *ngTemplateOutlet="buttonInner" />
      </md-outlined-button>
    }
    @case ('elevated') {
      <md-elevated-button
        [type]="type"
        [disabled]="isDisabled"
        [attr.aria-busy]="loading || null"
        [attr.aria-label]="ariaLabel || null"
        (click)="onClick($event)"
      >
        <ng-container *ngTemplateOutlet="buttonInner" />
      </md-elevated-button>
    }
    @case ('text') {
      <md-text-button
        [type]="type"
        [disabled]="isDisabled"
        [attr.aria-busy]="loading || null"
        [attr.aria-label]="ariaLabel || null"
        (click)="onClick($event)"
      >
        <ng-container *ngTemplateOutlet="buttonInner" />
      </md-text-button>
    }
    @case ('tonal') {
      <md-filled-tonal-button
        [type]="type"
        [disabled]="isDisabled"
        [attr.aria-busy]="loading || null"
        [attr.aria-label]="ariaLabel || null"
        (click)="onClick($event)"
      >
        <ng-container *ngTemplateOutlet="buttonInner" />
      </md-filled-tonal-button>
    }
  }
</div>

<ng-template #buttonInner>
  @if (loading) {
    <span class="m3-button-spinner" aria-hidden="true"></span>
  } @else if (icon) {
    <mifosx-m3-icon [name]="icon" [size]="iconSize" class="m3-button-icon-leading" />
  }
  @if (label) {
    <span class="m3-button-label">{{ label }}</span>
  }
  <ng-content />
  @if (trailingIcon && !loading) {
    <mifosx-m3-icon [name]="trailingIcon" [size]="iconSize" class="m3-button-icon-trailing" />
  }
</ng-template>
