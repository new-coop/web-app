@if (compact) {
  <button
    type="button"
    class="language-compact-button topbar-control topbar-control--text"
    [matMenuTriggerFor]="languageMenu"
    [attr.aria-label]="'labels.inputs.Language' | translate"
  >
    <span class="topbar-control-label">{{ 'languages.' + currentLanguage | translate }}</span>
    <mifosx-m3-icon name="expand_more" [size]="18" />
  </button>
  <mat-menu #languageMenu="matMenu">
    @for (language of languages; track language) {
      <button
        mat-menu-item
        type="button"
        (click)="selectLanguage(language)"
        [class.language-compact-active]="language === currentLanguage"
      >
        {{ 'languages.' + language | translate }}
      </button>
    }
  </mat-menu>
} @else {
  <mat-form-field id="language-selector" [appearance]="appearance" [class.outlined-variant]="appearance === 'outline'">
    @if (showLabel) {
      <mat-label>{{ 'labels.inputs.Language' | translate }}</mat-label>
    }
    <mat-select
      [formControl]="languageSelector"
      (selectionChange)="setLanguage()"
      class="languageselector"
      [placeholder]="!showLabel ? ('labels.inputs.Language' | translate) : ''"
    >
      @for (language of languages; track language) {
        <mat-option [value]="language">
          {{ 'languages.' + language | translate }}
        </mat-option>
      }
    </mat-select>
    <mifosx-m3-icon matIconPrefix name="translate" variant="duotone" [size]="20"></mifosx-m3-icon>
  </mat-form-field>
}
