<div class="container form-page form-page--narrow mat-elevation-z8">
  <mifosx-form-workspace eyebrow="labels.heading.Loans" title="labels.heading.Attach Originator">
    <form [formGroup]="attachLoanOriginatorForm" (ngSubmit)="submit()" class="form-workspace-form">
      <div class="form-workspace-body">
        <section class="form-section">
          <h2 class="form-section-title">{{ 'labels.heading.General' | translate }}</h2>
          <div class="form-grid">
            <mat-form-field>
              <mat-label>{{ 'labels.inputs.Loan Originator' | translate }}</mat-label>
              <mat-select formControlName="originatorId">
                @for (loanOriginator of loanOriginators; track loanOriginator) {
                  <mat-option [value]="loanOriginator.id">
                    {{ loanOriginator.name }}
                  </mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>
        </section>
      </div>
      <footer class="form-workspace-footer">
        <button type="button" mat-raised-button (click)="gotoLoanDefaultView()">
          {{ 'labels.buttons.Cancel' | translate }}
        </button>
        <button mat-raised-button color="primary" *mifosxHasPermission="'ATTACH_LOAN_ORIGINATOR'" type="submit">
          {{ 'labels.buttons.Submit' | translate }}
        </button>
      </footer>
    </form>
  </mifosx-form-workspace>
</div>
