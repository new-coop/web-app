<div class="container form-page form-page--narrow mat-elevation-z8">
  <mifosx-form-workspace eyebrow="labels.heading.Loans" title="labels.heading.Undo Write Off">
    <form [formGroup]="undoWriteOffLoanForm" (ngSubmit)="submit()" class="form-workspace-form">
      <div class="form-workspace-body">
        <section class="form-section">
          <h2 class="form-section-title">{{ 'labels.heading.General' | translate }}</h2>
          <div class="form-grid">
            <p class="m-b-20">
              {{ 'labels.text.Undo Write-off Description' | translate }}
            </p>

            <mat-form-field>
              <mat-label>{{ 'labels.inputs.Note' | translate }}</mat-label>
              <textarea matInput formControlName="note" cdkTextareaAutosize cdkAutosizeMinRows="2"></textarea>
            </mat-form-field>
          </div>
        </section>
      </div>
      <footer class="form-workspace-footer">
        <button type="button" mat-raised-button (click)="gotoLoanDefaultView()">
          {{ 'labels.buttons.Cancel' | translate }}
        </button>
        <button mat-raised-button color="primary" *mifosxHasPermission="'UNDOWRITEOFF_LOAN'" type="submit">
          {{ 'labels.buttons.Submit' | translate }}
        </button>
      </footer>
    </form>
  </mifosx-form-workspace>
</div>
