<mat-card class="card">
  <mat-card-header class="header">
    <span class="icon-chip">
      <fa-icon icon="money-bill"></fa-icon>
    </span>
    <h3 class="header-title">{{ 'labels.inputs.Amount Pending / Disbursed' | translate }}</h3>
    <mat-form-field id="office" class="office-field" subscriptSizing="dynamic">
      <mat-label>{{ 'labels.inputs.Office' | translate }}</mat-label>
      <mat-select [formControl]="officeId">
        @for (office of officeData; track office) {
          <mat-option [value]="office.id">
            {{ office.name }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-card-header>

  <mat-card-content>
    <!-- Structural directives like *ngIf break the canvas -->
    <div class="chart-area" [ngStyle]="{ display: hideOutput ? 'none' : 'block' }">
      <canvas id="disbursement-pie" width="800" height="600"></canvas>
    </div>
    @if (showFallback) {
      <div class="fallback align-center-center">
        <p>{{ 'labels.text.No Data' | translate }}</p>
      </div>
    }
  </mat-card-content>
</mat-card>
