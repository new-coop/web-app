<!-- Application Shell -->
<a class="skip-link" href="#main-content">{{ 'labels.text.Skip to main content' | translate }}</a>
<div id="mifosx-shell-container" class="app-shell">
  <!-- Sidebar (desktop) -->
  @if ((isHandset$ | async) === false) {
    <mifosx-app-sidebar
      class="shell-sidebar"
      [collapsed]="sidenavCollapsed"
      [collapsible]="true"
      (collapseToggle)="onMenuToggle()"
    />
  }

  <div class="shell-main">
    <!-- Topbar -->
    <mifosx-app-topbar (menuToggle)="onMenuToggle()" (searchOpen)="globalSearch.open()" />

    <!-- Progress Bar -->
    @if (progressBarMode !== 'none') {
      <div
        class="shell-progress"
        role="progressbar"
        aria-busy="true"
        [attr.aria-label]="'labels.text.Loading' | translate"
      >
        <div class="shell-progress-bar"></div>
      </div>
    }

    <!-- Breadcrumb -->
    <mifosx-breadcrumb></mifosx-breadcrumb>
    <!-- Content -->
    <mifosx-content></mifosx-content>
    <!-- Footer -->
    <mifosx-footer [styleClass]="'main-page'"></mifosx-footer>
  </div>
</div>

<!-- Sidebar (mobile drawer) -->
<p-drawer [visible]="mobileNavVisible" (visibleChange)="mobileNavVisible = $event" styleClass="mobile-nav-drawer">
  <mifosx-app-sidebar [collapsed]="false" (navigated)="mobileNavVisible = false" />
</p-drawer>

<!-- Global Search (Ctrl+K) -->
<mifosx-global-search #globalSearch />
